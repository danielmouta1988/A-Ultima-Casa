name: Deploy A Última Casa

on:
  push:
    branches: ["master"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar site
        run: |
          mkdir -p site/assets

          cp web/index.html site/index.html
          cp web/style.css site/style.css
          cp web/game.js site/game.js

          cp assets/dama.png site/assets/dama.png
          cp assets/rei.png site/assets/rei.png
          cp assets/Rajdhani-Regular.ttf site/assets/Rajdhani-Regular.ttf

          sed -i 's#../assets/#assets/#g' site/game.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
